name: Deploy with Docker Compose

on:
  workflow_run:
    workflows: ["Docker Build Cloud CI/CD"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: docker.io
  COMPOSE_VERSION: '2.25.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment environment
        id: deploy_env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="staging"
          fi
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "Deploying to: ${ENV}"

      - name: Create deployment
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: '${{ steps.deploy_env.outputs.environment }}',
              auto_merge: false,
              required_contexts: []
            });
            return deployment.data.id;

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest images
        run: |
          docker pull ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/pixelman-e8-server:latest
          docker pull ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/pixelman-btc-mempool:latest

      - name: Deploy with docker-compose
        run: |
          # Create docker-compose override for registry images
          cat > docker-compose.prod.yml <<EOF
          version: '3.8'
          services:
            e8-server:
              image: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/pixelman-e8-server:latest
            btc-mempool:
              image: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/pixelman-btc-mempool:latest
            nginx:
              image: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/pixelman-nginx:latest
          EOF
          
          # For demonstration, just validate the compose file
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config

      - name: Create deployment status - success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              environment_url: 'https://pixelman.example.com',
              description: 'Deployment successful'
            });

      - name: Create deployment status - failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'failure',
              description: 'Deployment failed'
            });

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ steps.deploy_env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
