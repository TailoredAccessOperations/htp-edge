version: '3.8'

services:
  e8-server:
    image: ${REGISTRY}/${DOCKERHUB_USERNAME}/pixelman-e8-server:${IMAGE_TAG:-latest}
    container_name: e8-server
    restart: always
    expose:
      - "8081"
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - e8-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  btc-mempool:
    image: ${REGISTRY}/${DOCKERHUB_USERNAME}/pixelman-btc-mempool:${IMAGE_TAG:-latest}
    container_name: btc-mempool
    restart: always
    expose:
      - "8082"
    environment:
      - PORT=8082
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/mempool"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - e8-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  nginx:
    image: ${REGISTRY}/${DOCKERHUB_USERNAME}/pixelman-nginx:${IMAGE_TAG:-latest}
    container_name: nginx-lb
    restart: always
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      e8-server:
        condition: service_started
      btc-mempool:
        condition: service_started
    networks:
      - e8-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  e8-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
