services:
  e8-server:
    build:
      context: /Users/piv/PixelMan
      dockerfile: docker/e8-server/Dockerfile
      cache_from:
        - type=gha
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: e8-server
    restart: unless-stopped
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - e8-network

  btc-mempool:
    build:
      context: /Users/piv/PixelMan
      dockerfile: docker/btc-mempool/Dockerfile
      cache_from:
        - type=gha
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: btc-mempool
    restart: unless-stopped
    expose:
      - "8082"
    environment:
      - PORT=8082
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/mempool"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - e8-network

  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      e8-server:
        condition: service_started
      btc-mempool:
        condition: service_started
    networks:
      - e8-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  e8-network:
    driver: bridge
    # IPv4-only network: the backends bind AF_INET only, so an IPv6 record
    # makes nginx resolve them to an address nothing listens on.
    enable_ipv6: false
