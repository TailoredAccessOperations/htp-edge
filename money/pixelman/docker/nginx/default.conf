upstream e8_backend {
    server e8-server:8081;
}
upstream btc_backend {
    server btc-mempool:8082;
}
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # prefix-passthrough: /api/btc/mempool -> /api/mempool (no suffix doubling)
    location /api/e8/ {
        proxy_pass http://e8_backend/api/;
    }

    location /api/btc/ {
        proxy_pass http://btc_backend/api/;
    }

    location /bitcoin/ {
        proxy_pass http://btc_backend/;
    }
}
