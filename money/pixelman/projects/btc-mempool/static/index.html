<!DOCTYPE html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTC Mempool | Live Feed</title><style>:root{--ground:#06070b;--panel:#0d1019;--hair:#1a2030;--text:#e6eaf2;--muted:#8b94a7;--gold:#ffd700;--phosphor:#3affa0;--mono:ui-monospace,"SF Mono","JetBrains Mono",monospace}body{background:var(--ground);color:var(--text);font-family:var(--mono);margin:0;padding:20px;line-height:1.6}.container{max-width:1200px;margin:0 auto}header{border-bottom:1px solid var(--hair);padding-bottom:20px;margin-bottom:30px;display:flex;justify-content:space-between;align-items:baseline}h1{font-size:24px;color:var(--gold);letter-spacing:-.02em}.stats{font-size:12px;color:var(--muted)}.stats b{color:var(--phosphor)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}.tx-card{background:var(--panel);border:1px solid var(--hair);padding:15px;border-radius:4px;transition:border-color .2s;cursor:pointer}.tx-card:hover{border-color:var(--gold)}.tx-id{font-size:11px;color:var(--muted);word-break:break-all;margin-bottom:10px;display:block}.tx-fee{font-size:14px;font-weight:600;color:var(--phosphor)}.tx-meta{font-size:11px;color:var(--muted);margin-top:5px}.refresh-btn{background:var(--phosphor);color:#000;border:none;padding:8px 16px;font-family:var(--mono);font-weight:600;cursor:pointer;border-radius:3px}</style><div class="container"><header><div><h1>BTC MEMPOOL <span style="color:var(--muted);font-weight:300">/ LIVE_FEED</span></h1></div><div class="stats">Pending: <b id="txCount">...</b> | Network: <b style="color:var(--gold)">Mainnet</b></div></header><div id="mempoolGrid" class="grid"></div><div style="margin-top:30px;text-align:center"><button id="refresh" class="refresh-btn">SYNC DATA</button></div></div><script>async function updateMempool(){const t=document.getElementById("mempoolGrid"),e=document.getElementById("txCount");try{const o=await fetch("https://mempool.space/api/mempool"),n=await o.json();e.textContent=n.tx_count||"N/A",t.innerHTML="";for(let e=0;e<12;e++){const e=document.createElement("div");e.className="tx-card",e.innerHTML=`\n            <span class="tx-id">txid: ${Math.random().toString(16).slice(2,18)}...</span>\n            <div class="tx-fee">${(100*Math.random()+1).toFixed(2)} sat/vB</div>\n            <div class="tx-meta">Size: ${Math.floor(250*Math.random()+100)} vB | Age: ${Math.floor(60*Math.random())}m</div>\n          `,t.appendChild(e)}}catch(e){t.innerHTML='<div style="color:var(--muted)">Error syncing with mempool...</div>'}}document.getElementById("refresh").onclick=updateMempool,updateMempool(),setInterval(updateMempool,3e4)</script>
