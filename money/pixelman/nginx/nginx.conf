worker_processes auto;
error_log /Users/piv/PixelMan/logs/nginx_error.log;
pid /Users/piv/PixelMan/logs/nginx.pid;

events {
    worker_connections 1024;
    use kqueue;
}

http {
    include /Users/piv/.homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /Users/piv/PixelMan/logs/nginx_access.log main;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    upstream e8_lattice_backend {
        least_conn;
        server 127.0.0.1:8081 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8082 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8083 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8084 weight=1 max_fails=3 fail_timeout=30s;
        
        keepalive 32;
    }
    
    upstream btc_backend {
        server 127.0.0.1:8085 max_fails=3 fail_timeout=30s;
    }
    
    server {
        listen 8080;
        server_name localhost;
        
        root /Users/piv/PixelMan/web;
        index index.html;
        
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        location /bitcoin/ {
            alias /Users/piv/PixelMan/projects/btc-mempool/static/;
            try_files $uri $uri/ /index.html;
        }
        
        location /api/e8/ {
            proxy_pass http://e8_lattice_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            
            proxy_buffering off;
            proxy_cache off;
        }
        
        location /api/btc/ {
            proxy_pass http://btc_backend/api/mempool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            
            proxy_buffering off;
            proxy_cache off;
        }
        
        location = /health {
            proxy_pass http://e8_lattice_backend;
            access_log off;
        }
        
        location /api/ {
            proxy_pass http://e8_lattice_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            
            proxy_buffering off;
            proxy_cache off;
        }
        
        location /ws {
            proxy_pass http://e8_lattice_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
        
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}